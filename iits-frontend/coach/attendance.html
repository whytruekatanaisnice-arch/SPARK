<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance · SPARK Coach</title>
<link rel="stylesheet" href="/shared/css/styles.css">
<style>
  .student-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .student-row:last-child { border-bottom: none; }
  .student-row .name { flex: 1; font-weight: 600; font-size: 0.9rem; }
  .status-pills { display: flex; gap: 6px; }
  .status-pill {
    padding: 7px 11px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .status-pill[data-status="present"].on { background: var(--success-bg); color: var(--success); border-color: var(--success); }
  .status-pill[data-status="late"].on { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }
  .status-pill[data-status="excused"].on { background: #E7EDFB; color: var(--primary); border-color: var(--primary); }
  .status-pill[data-status="absent"].on { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body data-role="coach" data-active="attendance" data-title="Attendance">
<div id="page-root">

  <div class="page-head">
    <div><h1>Take attendance</h1><p>Pick a club and date, then mark each student in one tap.</p></div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="form-row" style="margin:0;align-items:flex-end;">
      <div class="field" style="margin:0;"><label for="club-select">Club</label><select id="club-select"></select></div>
      <div class="field" style="margin:0;max-width:170px;"><label for="date-input">Date</label><input type="date" id="date-input"></div>
      <button class="btn btn-primary" id="start-session-btn">Create session</button>
    </div>
    <div class="form-row" style="margin:14px 0 0;align-items:flex-end;">
      <div class="field" style="margin:0;flex:1;"><label for="session-select">Existing sessions</label><select id="session-select"></select></div>
      <button class="btn btn-secondary" id="open-session-btn">Open session</button>
    </div>
  </div>

  <div id="session-area" style="display:none;">
    <div class="card" style="margin-bottom:16px;">
      <div class="flex between" style="margin-bottom:12px;">
        <div><h2 style="margin:0;">Session tasks</h2><p class="muted" id="session-heading" style="margin:4px 0 0;"></p></div>
      </div>
      <form id="session-task-form">
        <div class="form-row">
          <div class="field" style="margin:0;flex:1;"><label for="session-task-title">Task title</label><input type="text" id="session-task-title" required placeholder="e.g. Complete the warm-up routine"></div>
          <div class="field" style="margin:0;max-width:220px;"><label for="session-task-due">Due date (optional)</label><input type="datetime-local" id="session-task-due"></div>
        </div>
        <div class="field" style="margin-top:12px;"><label for="session-task-description">Description</label><textarea id="session-task-description" rows="2" placeholder="Instructions for students"></textarea></div>
        <button class="btn btn-secondary" id="assign-task-btn" type="submit">Assign task to this session</button>
      </form>
      <div id="session-tasks-list" style="margin-top:14px;"></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-mode="face">Face recognition</div>
      <div class="tab" data-mode="checklist">Checklist</div>
    </div>

    <div id="face-mode" style="display:none;">
      <div class="card" style="text-align:center;">
        <video id="face-camera" autoplay playsinline muted style="width:100%;max-width:480px;max-height:360px;object-fit:cover;border-radius:var(--radius-card);background:#111;"></video>
        <canvas id="face-capture" style="display:none;"></canvas>
        <p><strong id="face-checkin-count">0 / 0 students checked in</strong></p>
        <p class="muted" id="face-status" style="font-size:0.84rem;">Start recognition to check in students one at a time.</p>
        <div class="flex gap-8" style="justify-content:center;">
          <button type="button" class="btn btn-primary" id="start-face-camera">Start face recognition</button>
          <button type="button" class="btn btn-ghost" id="stop-face-camera" disabled>Stop recognition</button>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0;" id="checklist-card">
      <div class="flex between" style="padding:14px 16px;border-bottom:1px solid var(--border);">
        <strong id="roster-count" style="font-size:0.85rem;">0 students</strong>
        <button class="btn btn-secondary btn-sm" id="mark-all-present">Mark all present</button>
      </div>
      <div id="roster-list"></div>
    </div>

    <button class="btn btn-primary" id="save-attendance-btn" style="width:100%;margin-top:14px;">Save attendance</button>
  </div>

  <div class="modal-backdrop" id="reason-modal">
    <div class="modal">
      <div class="modal-head"><h2>Reason for excused absence</h2><button type="button" class="modal-close" id="reason-close">✕</button></div>
      <form id="reason-form">
        <p class="muted" id="reason-student-name" style="margin-top:-6px;"></p>
        <div class="field"><label for="reason-text">Reason</label><textarea id="reason-text" rows="3" required placeholder="e.g. Medical appointment, family emergency…"></textarea></div>
        <div class="flex gap-8" style="justify-content:flex-end;">
          <button type="button" class="btn btn-secondary" id="reason-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save reason</button>
        </div>
      </form>
    </div>
  </div>

</div>
<script src="/shared/js/config.js"></script>
<script src="/shared/js/toast.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/shell.js"></script>
<script>
let roster = [];       // [{id, full_name, student_number}]
let marks = {};         // student_id -> {status, marked_via}
let currentSessionId = null;
let currentClubId = null;
let faceStream = null;
let faceScanRunning = false;
let faceScanInProgress = false;

const STATUSES = [
  { key: "present", label: "Present" },
  { key: "late", label: "Late" },
  { key: "excused", label: "Excused" },
  { key: "absent", label: "Absent" },
];

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[character]);
}

function renderRoster() {
  document.getElementById("roster-count").textContent = `${roster.length} student${roster.length === 1 ? "" : "s"}`;
  const checkedIn = Object.values(marks).filter(mark => mark.status === "present" || mark.status === "late").length;
  document.getElementById("face-checkin-count").textContent = `${checkedIn} / ${roster.length} students checked in`;
  document.getElementById("roster-list").innerHTML = roster.map(s => `
    <div class="student-row" style="flex-wrap:wrap;">
      <div class="name">
        ${escapeHtml(s.full_name)}<div class="muted" style="font-weight:400;font-size:0.76rem;">${escapeHtml(s.student_number || "")}</div>
        ${marks[s.id]?.status === "excused" && marks[s.id]?.note ? `<div class="muted" style="font-size:0.76rem;margin-top:3px;"><strong>Reason:</strong> ${escapeHtml(marks[s.id].note)}</div>` : ""}
      </div>
      <div class="status-pills" data-student="${s.id}">
        ${STATUSES.map(st => `<button type="button" class="status-pill ${marks[s.id]?.status === st.key ? "on" : ""}" data-status="${st.key}">${st.label}</button>`).join("")}
      </div>
    </div>`).join("");

  document.querySelectorAll(".status-pills").forEach(group => {
    group.addEventListener("click", (e) => {
      const btn = e.target.closest(".status-pill");
      if (!btn) return;
      const sid = group.dataset.student;

      if (btn.dataset.status === "excused") {
        // Excused always needs a reason — open the popup instead of marking immediately.
        // Re-clicking an already-excused student reopens it pre-filled, so the reason can be edited.
        openReasonModal(sid);
        return;
      }

      marks[sid] = { status: btn.dataset.status, marked_via: "checklist" };
      group.querySelectorAll(".status-pill").forEach(p => p.classList.toggle("on", p === btn));
    });
  });
}

let pendingExcuseStudentId = null;

function openReasonModal(studentId) {
  pendingExcuseStudentId = studentId;
  const student = roster.find(s => s.id === studentId);
  document.getElementById("reason-student-name").textContent = student ? student.full_name : "";
  document.getElementById("reason-text").value = marks[studentId]?.note || "";
  document.getElementById("reason-modal").classList.add("open");
  setTimeout(() => document.getElementById("reason-text").focus(), 50);
}

function closeReasonModal() {
  document.getElementById("reason-modal").classList.remove("open");
  document.getElementById("reason-form").reset();
  pendingExcuseStudentId = null;
}

async function loadMyClubs() {
  const user = IITS.getUser();
  const clubs = await IITS.api("/api/clubs");
  const mine = clubs.filter(c => c.coach_id === user.id);
  const select = document.getElementById("club-select");
  select.innerHTML = mine.map(c => `<option value="${c.id}">${c.name}</option>`).join("") || `<option value="">No clubs assigned</option>`;
  await loadSessions();
}

async function loadSessions() {
  const clubId = document.getElementById("club-select").value;
  const select = document.getElementById("session-select");
  if (!clubId) {
    select.innerHTML = `<option value="">No sessions available</option>`;
    return;
  }
  try {
    const sessions = await IITS.api(`/api/coach/attendance/sessions?club_id=${encodeURIComponent(clubId)}`);
    select.innerHTML = sessions.length
      ? sessions.map(s => `<option value="${s.id}">${escapeHtml(s.session_date)} · ${s.id.slice(0, 8)}</option>`).join("")
      : `<option value="">No sessions yet</option>`;
  } catch (e) { IITS.toast(e.message, "error"); }
}

async function activateSession(session) {
  stopFaceCamera();
  currentSessionId = session.id;
  currentClubId = session.club_id;
  const clubId = currentClubId;
  document.getElementById("date-input").value = session.session_date;
  const [loadedRoster, records, tasks] = await Promise.all([
    IITS.api(`/api/coach/clubs/${clubId}/roster`),
    IITS.api(`/api/coach/attendance/sessions/${session.id}/records`),
    IITS.api(`/api/coach/tasks?club_id=${encodeURIComponent(clubId)}&session_id=${encodeURIComponent(session.id)}`),
  ]);
  roster = loadedRoster;
  marks = Object.fromEntries(records.map(record => [record.student_id, {
    status: record.status, marked_via: record.marked_via, note: record.note,
  }]));
  renderRoster();
  renderSessionTasks(tasks);
  const club = (await IITS.api("/api/clubs")).find(item => item.id === clubId);
  document.getElementById("session-heading").textContent = `${club?.name || "Club"} · ${session.session_date}`;
  document.getElementById("session-area").style.display = "block";
  switchMode("face");
  document.getElementById("face-status").textContent =
    `Club roster loaded: ${roster.length} active student${roster.length === 1 ? "" : "s"}. Start recognition to check them in.`;
}

function renderSessionTasks(tasks) {
  const list = document.getElementById("session-tasks-list");
  if (!tasks.length) {
    list.innerHTML = `<p class="muted" style="margin:0;">No tasks assigned to this session yet.</p>`;
    return;
  }
  list.innerHTML = tasks.map(task => `
    <div style="border-top:1px solid var(--border);padding:10px 0;">
      <strong>${escapeHtml(task.title)}</strong>
      ${task.description ? `<div class="muted" style="font-size:0.84rem;margin-top:3px;">${escapeHtml(task.description)}</div>` : ""}
      ${task.due_date ? `<div class="muted" style="font-size:0.78rem;margin-top:3px;">Due ${escapeHtml(new Date(task.due_date).toLocaleString())}</div>` : ""}
    </div>`).join("");
}

async function startSession() {
  const clubId = document.getElementById("club-select").value;
  const date = document.getElementById("date-input").value;
  if (!clubId || !date) { IITS.toast("Pick a club and date first", "error"); return; }

  try {
    const session = await IITS.api("/api/coach/attendance/sessions", { method: "POST", body: { club_id: clubId, session_date: date } });
    await loadSessions();
    document.getElementById("session-select").value = session.id;
    await activateSession(session);
    IITS.toast("Session started — mark students below", "success");
  } catch (e) { IITS.toast(e.message, "error"); }
}

async function openSelectedSession() {
  const sessionId = document.getElementById("session-select").value;
  if (!sessionId) { IITS.toast("Choose an existing session first", "error"); return; }
  try {
    const sessions = await IITS.api(`/api/coach/attendance/sessions?club_id=${encodeURIComponent(document.getElementById("club-select").value)}`);
    const session = sessions.find(item => item.id === sessionId);
    if (!session) { IITS.toast("Session not found. Refresh and try again.", "error"); return; }
    await activateSession(session);
  } catch (e) { IITS.toast(e.message, "error"); }
}

async function assignSessionTask(event) {
  event.preventDefault();
  if (!currentSessionId || !currentClubId) return;
  const button = document.getElementById("assign-task-btn");
  const payload = {
    club_id: currentClubId,
    session_id: currentSessionId,
    title: document.getElementById("session-task-title").value.trim(),
    description: document.getElementById("session-task-description").value.trim() || null,
    due_date: document.getElementById("session-task-due").value
      ? new Date(document.getElementById("session-task-due").value).toISOString()
      : null,
  };
  button.disabled = true;
  try {
    await IITS.api("/api/coach/tasks", { method: "POST", body: payload });
    document.getElementById("session-task-form").reset();
    const tasks = await IITS.api(`/api/coach/tasks?club_id=${encodeURIComponent(currentClubId)}&session_id=${encodeURIComponent(currentSessionId)}`);
    renderSessionTasks(tasks);
    IITS.toast("Task assigned to this session", "success");
  } catch (e) { IITS.toast(e.message, "error"); }
  button.disabled = false;
}

async function saveAttendance() {
  if (!currentSessionId) return;
  const records = Object.entries(marks).map(([student_id, m]) => ({ student_id, status: m.status, marked_via: m.marked_via, note: m.note || null }));
  if (!records.length) { IITS.toast("Mark at least one student first", "error"); return; }
  const btn = document.getElementById("save-attendance-btn");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const res = await IITS.api(`/api/coach/attendance/sessions/${currentSessionId}/records`, { method: "POST", body: { records } });
    const notices = res && res.absence_notices_sent ? ` · ${res.absence_notices_sent} absence notice(s) emailed to students & parents` : "";
    IITS.toast(`Saved attendance for ${records.length} student(s)${notices}`, "success");
  } catch (e) { IITS.toast(e.message, "error"); }
  btn.disabled = false; btn.textContent = "Save attendance";
}

async function startFaceCamera() {
  if (faceStream) return;
  try {
    faceStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    const video = document.getElementById("face-camera");
    video.srcObject = faceStream;
    await video.play();
    faceScanRunning = true;
    document.getElementById("start-face-camera").disabled = true;
    document.getElementById("stop-face-camera").disabled = false;
    document.getElementById("face-status").textContent = "Recognition running. Present one student's face clearly to the camera.";
    scanNextFace();
  } catch (e) {
    stopFaceCamera();
    document.getElementById("face-status").textContent = `Could not start the camera: ${e.message}`;
    IITS.toast("Allow camera access and use localhost or HTTPS", "error");
  }
}

function stopFaceCamera() {
  faceScanRunning = false;
  if (faceStream) faceStream.getTracks().forEach(track => track.stop());
  faceStream = null;
  const video = document.getElementById("face-camera");
  video.srcObject = null;
  document.getElementById("start-face-camera").disabled = false;
  document.getElementById("stop-face-camera").disabled = true;
  if (currentSessionId) document.getElementById("face-status").textContent = "Recognition stopped.";
}

async function scanNextFace() {
  if (!currentSessionId || !faceStream || !faceScanRunning || faceScanInProgress) return;
  const video = document.getElementById("face-camera");
  if (!video.videoWidth || !video.videoHeight) {
    window.setTimeout(scanNextFace, 500);
    return;
  }
  faceScanInProgress = true;
  const status = document.getElementById("face-status");
  try {
    const canvas = document.getElementById("face-capture");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    const result = await IITS.api(`/api/coach/attendance/sessions/${currentSessionId}/recognize`, {
      method: "POST",
      body: { image: canvas.toDataURL("image/jpeg", 0.82) },
    });
    if (result.status === "found") {
      const alreadyCheckedIn = marks[result.student_id]?.status === "present";
      marks[result.student_id] = { status: "present", marked_via: "face" };
      renderRoster();
      status.textContent = alreadyCheckedIn
        ? `${result.student_name} is already checked in. Present the next student.`
        : `${result.student_name} recognized. Present the next student.`;
    } else if (result.status === "not_in_roster") {
      status.textContent = "Recognized student is not an active member of this club.";
    } else if (result.status === "ambiguous") {
      status.textContent = "This face matches duplicate student IC records. Ask an administrator to resolve the roster.";
    } else {
      status.textContent = "No enrolled student matched this frame. Present one face clearly at a time.";
    }
  } catch (e) {
    stopFaceCamera();
    status.textContent = e.message;
    IITS.toast(e.message, "error");
  } finally {
    faceScanInProgress = false;
    if (faceScanRunning && faceStream) window.setTimeout(scanNextFace, 700);
  }
}

function switchMode(mode) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
  document.getElementById("face-mode").style.display = mode === "face" ? "block" : "none";
  document.getElementById("checklist-card").style.display = mode === "checklist" ? "block" : "none";
  if (mode !== "face") stopFaceCamera();
}

document.addEventListener("iits:shell-ready", async () => {
  document.getElementById("date-input").value = new Date().toISOString().slice(0, 10);
  document.getElementById("face-mode").style.display = "none";
  document.getElementById("checklist-card").style.display = "none";
  await loadMyClubs();
  document.getElementById("start-session-btn").addEventListener("click", startSession);
  document.getElementById("open-session-btn").addEventListener("click", openSelectedSession);
  document.getElementById("club-select").addEventListener("change", () => {
    currentSessionId = null;
    currentClubId = null;
    document.getElementById("session-area").style.display = "none";
    switchMode("face");
    stopFaceCamera();
    loadSessions();
  });
  document.getElementById("session-task-form").addEventListener("submit", assignSessionTask);
  document.getElementById("start-face-camera").addEventListener("click", startFaceCamera);
  document.getElementById("stop-face-camera").addEventListener("click", stopFaceCamera);
  document.getElementById("save-attendance-btn").addEventListener("click", saveAttendance);
  document.getElementById("mark-all-present").addEventListener("click", () => {
    roster.forEach(s => marks[s.id] = { status: "present", marked_via: "checklist" });
    renderRoster();
  });
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchMode(t.dataset.mode)));
  window.addEventListener("pagehide", stopFaceCamera);

  document.getElementById("reason-close").addEventListener("click", closeReasonModal);
  document.getElementById("reason-cancel").addEventListener("click", closeReasonModal);
  document.getElementById("reason-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const reason = document.getElementById("reason-text").value.trim();
    if (!reason) { IITS.toast("Please enter a reason", "error"); return; }
    marks[pendingExcuseStudentId] = { status: "excused", marked_via: "checklist", note: reason };
    closeReasonModal();
    renderRoster();
  });
});
</script>
</body>
</html>
