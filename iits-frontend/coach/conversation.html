<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages · SPARK Coach</title><link rel="stylesheet" href="/shared/css/styles.css">
<style>
.msg-layout{display:flex;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);overflow:hidden;height:72vh}.msg-list{width:280px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}.msg-list-item{padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;font-size:.85rem}.msg-list-item:hover,.msg-list-item.active{background:#F8FAFF}.msg-thread{flex:1;display:flex;flex-direction:column;min-width:0}.msg-bubbles{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:70%;padding:9px 13px;border-radius:12px;font-size:.86rem;background:#F0F3FA;align-self:flex-start}.bubble.mine{background:var(--primary);color:#fff;align-self:flex-end}.msg-compose{border-top:1px solid var(--border);padding:12px;display:flex;gap:8px}.msg-new{border-bottom:1px solid var(--border);padding:12px;display:flex;gap:8px}.msg-new select{flex:1;min-width:0}@media(max-width:760px){.msg-layout{flex-direction:column;height:auto}.msg-list{width:100%;max-height:220px}}
</style>
</head>
<body data-role="coach" data-active="conversation" data-title="Messages"><div id="page-root">
<div class="page-head"><div><h1>Messages</h1><p>Message administrators and parents.</p></div></div>
<div class="msg-layout"><div class="msg-list"><div class="msg-new"><select id="contact-select"><option>Loading contacts…</option></select><button class="btn btn-primary" id="new-conversation-btn" disabled>New</button></div><div id="conv-list"><div class="loading-row"><span class="spinner"></span> Loading…</div></div></div><div class="msg-thread"><div class="msg-bubbles" id="msg-bubbles"><div class="empty-state" style="margin:auto"><div class="title">Select a conversation</div>Choose a thread or start a new message.</div></div><div class="msg-compose" id="msg-compose" style="display:none"><input type="text" id="msg-input" placeholder="Type a message…"><button class="btn btn-primary" id="send-btn">Send</button></div></div></div>
</div>
<script src="/shared/js/config.js"></script><script src="/shared/js/toast.js"></script><script src="/shared/js/api.js"></script><script src="/shared/js/shell.js"></script><script src="/shared/js/conversation.js"></script><script>document.addEventListener("iits:shell-ready",()=>SPARKConversation.init());</script>
</body></html>
