<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile · IITS Student</title>
<link rel="stylesheet" href="/shared/css/styles.css">
</head>
<body data-role="student" data-active="profile" data-title="Profile">
<div id="page-root">

  <div class="page-head"><div><h1>My profile</h1><p>Keep your details up to date.</p></div></div>

  <div class="grid grid-2" style="align-items:start;">
    <div class="card">
      <h3>Personal details</h3>
      <form id="profile-form">
        <div class="field"><label for="full_name">Full name</label><input type="text" id="full_name" required></div>
        <div class="field"><label for="phone">Phone</label><input type="text" id="phone"></div>
        <div class="field"><label for="class_name">Class</label><input type="text" id="class_name"></div>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
    </div>
    <div class="card">
      <h3>Change password</h3>
      <form id="password-form">
        <div class="field"><label for="old_password">Current password</label><input type="password" id="old_password" required></div>
        <div class="field"><label for="new_password">New password</label><input type="password" id="new_password" required minlength="6"></div>
        <button type="submit" class="btn btn-secondary">Update password</button>
      </form>
    </div>
  </div>

</div>
<script src="/shared/js/config.js"></script>
<script src="/shared/js/toast.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/shell.js"></script>
<script>
document.addEventListener("iits:shell-ready", async () => {
  try {
    const me = await IITS.api("/api/auth/me");
    document.getElementById("full_name").value = me.full_name || "";
    document.getElementById("phone").value = me.phone || "";
  } catch (e) { IITS.toast(e.message, "error"); }

  document.getElementById("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      full_name: document.getElementById("full_name").value.trim(),
      phone: document.getElementById("phone").value.trim() || null,
      class_name: document.getElementById("class_name").value.trim() || null,
    };
    try {
      const updated = await IITS.api("/api/student/profile", { method: "PATCH", body: payload });
      IITS.setUser(updated);
      IITS.toast("Profile updated", "success");
    } catch (err) { IITS.toast(err.message, "error"); }
  });

  document.getElementById("password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = { old_password: document.getElementById("old_password").value, new_password: document.getElementById("new_password").value };
    try {
      await IITS.api("/api/auth/change-password", { method: "POST", body: payload });
      IITS.toast("Password updated", "success");
      document.getElementById("password-form").reset();
    } catch (err) { IITS.toast(err.message, "error"); }
  });
});
</script>
</body>
</html>
