<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NILAM · IITS Student</title>
<link rel="stylesheet" href="/shared/css/styles.css">
</head>
<body data-role="student" data-active="nilam" data-title="NILAM">
<div id="page-root">

  <div class="page-head">
    <div><h1>NILAM reading log</h1><p>Log a book — it syncs straight into your PAJSK score, no separate portal.</p></div>
    <button class="btn btn-primary" id="new-btn">+ Log a book</button>
  </div>

  <div id="nilam-list"><div class="loading-row"><span class="spinner"></span> Loading…</div></div>

</div>

<div class="modal-backdrop" id="nilam-modal">
  <div class="modal">
    <div class="modal-head"><h2>Log a book</h2><button class="modal-close" id="modal-close">✕</button></div>
    <form id="nilam-form">
      <div class="field"><label for="book_title">Book title</label><input type="text" id="book_title" required></div>
      <div class="field"><label for="author">Author (optional)</label><input type="text" id="author"></div>
      <div class="form-row">
        <div class="field"><label for="pages_read">Pages read</label><input type="number" id="pages_read" min="1"></div>
        <div class="field"><label for="date_completed">Date completed</label><input type="date" id="date_completed" required></div>
      </div>
      <div class="field"><label for="summary">Short summary (optional)</label><textarea id="summary" rows="2"></textarea></div>
      <div class="flex gap-8" style="justify-content:flex-end;">
        <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="/shared/js/config.js"></script>
<script src="/shared/js/toast.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/shell.js"></script>
<script>
async function loadNilam() {
  const list = document.getElementById("nilam-list");
  try {
    const items = await IITS.api("/api/student/nilam");
    list.innerHTML = items.length
      ? `<div class="table-wrap"><table><thead><tr><th>Book</th><th>Author</th><th>Pages</th><th>Completed</th></tr></thead><tbody>` +
        items.map(n => `<tr><td>${n.book_title}</td><td class="muted">${n.author || "—"}</td><td>${n.pages_read ?? "—"}</td><td>${n.date_completed}</td></tr>`).join("") +
        `</tbody></table></div>`
      : `<div class="card empty-state"><div class="title">No books logged yet</div>Log your first book above.</div>`;
  } catch (e) { IITS.toast(e.message, "error"); }
}

function openModal() { document.getElementById("nilam-modal").classList.add("open"); }
function closeModal() { document.getElementById("nilam-modal").classList.remove("open"); document.getElementById("nilam-form").reset(); }

document.addEventListener("iits:shell-ready", () => {
  document.getElementById("date_completed").value = new Date().toISOString().slice(0, 10);
  loadNilam();
  document.getElementById("new-btn").addEventListener("click", openModal);
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("cancel-btn").addEventListener("click", closeModal);

  document.getElementById("nilam-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      book_title: document.getElementById("book_title").value.trim(),
      author: document.getElementById("author").value.trim() || null,
      pages_read: document.getElementById("pages_read").value ? parseInt(document.getElementById("pages_read").value) : null,
      date_completed: document.getElementById("date_completed").value,
      summary: document.getElementById("summary").value.trim() || null,
    };
    try {
      await IITS.api("/api/student/nilam", { method: "POST", body: payload });
      IITS.toast("Book logged — PAJSK points added automatically", "success");
      closeModal();
      loadNilam();
    } catch (err) { IITS.toast(err.message, "error"); }
  });
});
</script>
</body>
</html>
