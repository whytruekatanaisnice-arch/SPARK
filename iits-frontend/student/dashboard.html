<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · IITS Student</title>
<link rel="stylesheet" href="/shared/css/styles.css">
</head>
<body data-role="student" data-active="dashboard" data-title="Dashboard">
<div id="page-root">

  <div class="page-head"><div><h1>Hi, <span id="greet-name">there</span></h1><p>Here's your co-curricular snapshot.</p></div></div>

  <div class="grid grid-2" style="align-items:start;">
    <div class="card">
      <div class="section-head"><h2>PAJSK progress</h2><a href="/student/pajsk.html" class="muted" style="font-size:0.8rem;">View breakdown →</a></div>
      <div class="stat-value" style="font-family:'Fraunces',serif;font-size:2.2rem;" id="pajsk-total">–</div>
      <p class="muted" style="font-size:0.82rem;">Total points this year</p>
    </div>
    <div class="card">
      <div class="section-head"><h2>My clubs</h2><a href="/student/clubs.html" class="muted" style="font-size:0.8rem;">View all →</a></div>
      <div id="clubs-mini"><p class="muted">Loading…</p></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div class="section-head"><h2>Upcoming tasks</h2><a href="/student/tasks.html" class="muted" style="font-size:0.8rem;">View all →</a></div>
    <div id="tasks-mini"><p class="muted">Loading…</p></div>
  </div>

</div>
<script src="/shared/js/config.js"></script>
<script src="/shared/js/toast.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/shell.js"></script>
<script>
document.addEventListener("iits:shell-ready", async () => {
  const user = IITS.getUser();
  document.getElementById("greet-name").textContent = (user && user.full_name) ? user.full_name.split(" ")[0] : "there";

  try {
    const pajsk = await IITS.api("/api/student/pa_jsK");
    document.getElementById("pajsk-total").textContent = pajsk.total;
  } catch (e) { /* handled by api.js redirects */ }

  try {
    const clubs = await IITS.api("/api/student/clubs");
    document.getElementById("clubs-mini").innerHTML = clubs.length
      ? clubs.map(c => `<div class="flex between" style="padding:6px 0;"><span style="font-size:0.88rem;">${c.name}</span><span class="badge badge-blue">${c.category || ""}</span></div>`).join("")
      : `<p class="muted">You're not in any clubs yet.</p>`;
  } catch (e) { IITS.toast(e.message, "error"); }

  try {
    const tasks = await IITS.api("/api/student/tasks");
    const upcoming = tasks.filter(t => !t.due_date || new Date(t.due_date) >= new Date()).slice(0, 4);
    document.getElementById("tasks-mini").innerHTML = upcoming.length
      ? upcoming.map(t => `<div class="flex between" style="padding:6px 0;"><span style="font-size:0.88rem;">${t.title}</span>${t.due_date ? `<span class="muted" style="font-size:0.78rem;">Due ${new Date(t.due_date).toLocaleDateString()}</span>` : ""}</div>`).join("")
      : `<p class="muted">No upcoming tasks. 🎉</p>`;
  } catch (e) { IITS.toast(e.message, "error"); }
});
</script>
</body>
</html>
