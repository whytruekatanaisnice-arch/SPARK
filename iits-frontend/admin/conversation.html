<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages · IITS Admin</title>
<link rel="stylesheet" href="/shared/css/styles.css">
<style>
  .msg-layout { display: flex; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); overflow: hidden; height: 72vh; }
  .msg-list { width: 280px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  .msg-list-item { padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 0.85rem; }
  .msg-list-item:hover, .msg-list-item.active { background: #F8FAFF; }
  .msg-thread { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .msg-bubbles { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 70%; padding: 9px 13px; border-radius: 12px; font-size: 0.86rem; background: #F0F3FA; align-self: flex-start; }
  .bubble.mine { background: var(--primary); color: #fff; align-self: flex-end; }
  .msg-compose { border-top: 1px solid var(--border); padding: 12px; display: flex; gap: 8px; }
  @media (max-width: 760px) { .msg-layout { flex-direction: column; height: auto; } .msg-list { width: 100%; max-height: 220px; } }
</style>
</head>
<body data-role="admin" data-active="conversation" data-title="Messages">
<div id="page-root">

  <div class="page-head"><div><h1>Messages</h1><p>Direct messages between admin, coaches, students, and parents.</p></div></div>

  <div class="msg-layout">
    <div class="msg-list" id="conv-list"><div class="loading-row"><span class="spinner"></span> Loading…</div></div>
    <div class="msg-thread">
      <div class="msg-bubbles" id="msg-bubbles"><div class="empty-state" style="margin:auto;"><div class="title">Select a conversation</div>Pick a thread on the left, or start a new one.</div></div>
      <div class="msg-compose" id="msg-compose" style="display:none;">
        <input type="text" id="msg-input" placeholder="Type a message…">
        <button class="btn btn-primary" id="send-btn">Send</button>
      </div>
    </div>
  </div>

</div>
<script src="/shared/js/config.js"></script>
<script src="/shared/js/toast.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/shell.js"></script>
<script>
let currentConversationId = null;

async function loadConversations() {
  const list = document.getElementById("conv-list");
  try {
    const convs = await IITS.api("/api/messaging/conversations");
    if (!convs.length) { list.innerHTML = `<div class="empty-state"><div class="title">No conversations</div>Messages you send or receive will appear here.</div>`; return; }
    list.innerHTML = convs.map(c => `<div class="msg-list-item" data-id="${c.id}">${c.subject || "(no subject)"}</div>`).join("");
    list.querySelectorAll(".msg-list-item").forEach(el => el.addEventListener("click", () => openConversation(el.dataset.id, el)));
  } catch (e) { IITS.toast(e.message, "error"); }
}

async function openConversation(id, el) {
  currentConversationId = id;
  document.querySelectorAll(".msg-list-item").forEach(x => x.classList.remove("active"));
  if (el) el.classList.add("active");
  document.getElementById("msg-compose").style.display = "flex";
  const bubbles = document.getElementById("msg-bubbles");
  bubbles.innerHTML = `<div class="loading-row"><span class="spinner"></span> Loading messages…</div>`;
  try {
    const messages = await IITS.api(`/api/messaging/conversations/${id}/messages`);
    const me = IITS.getUser();
    bubbles.innerHTML = messages.length
      ? messages.map(m => `<div class="bubble ${m.sender_id === me.id ? "mine" : ""}">${m.body}</div>`).join("")
      : `<div class="empty-state" style="margin:auto;"><div class="title">No messages yet</div>Say hello below.</div>`;
    bubbles.scrollTop = bubbles.scrollHeight;
  } catch (e) { IITS.toast(e.message, "error"); }
}

document.addEventListener("iits:shell-ready", () => {
  loadConversations();
  document.getElementById("send-btn").addEventListener("click", sendMessage);
  document.getElementById("msg-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
});

async function sendMessage() {
  const input = document.getElementById("msg-input");
  const body = input.value.trim();
  if (!body || !currentConversationId) return;
  try {
    await IITS.api(`/api/messaging/conversations/${currentConversationId}/messages?body=${encodeURIComponent(body)}`, { method: "POST" });
    input.value = "";
    openConversation(currentConversationId);
  } catch (e) { IITS.toast(e.message, "error"); }
}
</script>
</body>
</html>
