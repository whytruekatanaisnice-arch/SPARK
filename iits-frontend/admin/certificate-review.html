<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PAJSK Certificate Review · IITS Admin</title>
  <link rel="stylesheet" href="/shared/css/styles.css">
</head>
<body data-role="admin" data-active="certificate-review" data-title="PAJSK Certificate Review" data-certificate-workflow="review">
<div id="page-root">
  <div class="page-head">
    <div><h1>PAJSK certificate review</h1><p>Verify the certificate and entered details before approving points.</p></div>
  </div>
  <div class="field" style="max-width:280px;">
    <label for="review-status">Show submissions</label>
    <select id="review-status">
      <option value="pending">Awaiting review</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
      <option value="">All submissions</option>
    </select>
  </div>
  <div id="review-list"><div class="loading-row"><span class="spinner"></span> Loading submissions…</div></div>
</div>
<script src="/shared/js/config.js"></script>
<script src="/shared/js/toast.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/shell.js"></script>
<script src="/shared/js/achievement-certificates.js"></script>
</body>
</html>
